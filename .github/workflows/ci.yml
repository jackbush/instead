name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # web-ext crashes on Node 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      # Builds everything, then lints the Firefox build. The tree lints clean,
      # so warnings fail the job too; web-ext's version is pinned in
      # package.json so new rules can't turn it red on their own.
      - name: Build and lint
        run: npm run lint
