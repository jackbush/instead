name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # web-ext crashes on Node 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Unit tests
        run: node --test

      - name: Build the extension
        run: sh scripts/build-extension.sh

      # The tree lints clean today, so warnings fail the job too; the pinned
      # version keeps new rules from turning it red on their own.
      - name: Lint the Firefox build
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/firefox --warnings-as-errors
